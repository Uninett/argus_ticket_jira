[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "argus_ticket_jira"
authors = [{name = "Johanna England", email = "johanna.england@sikt.no"}]
readme = "README.md"
maintainers = [{name = "Johanna England", email = "johanna.england@sikt.no"}]
dependencies = [
    "argus-server>=2.10.0",
    "jira>=3.4.1",
    "markdownify>=0.11",
]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]
dynamic = ["version", "description"]

[project.optional-dependencies]
dev = ["ruff"]
test = [
    "tox",
    "coverage",
]

[project.urls]
Home = "https://github.com/Uninett/argus_ticket_jira"
Issues = "https://github.com/Uninett/argus_ticket_jira/issues"

[tool.ruff]
line-length = 88
extend-exclude = [
    ".egg-info",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
fixable = ["I"]
